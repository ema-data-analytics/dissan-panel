<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DISSAN · Stock</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=18">
</head>
<body>

<!-- ================== LOGIN ================== -->
<div id="login-wrap">
  <div class="login-box">
    <div class="marca">EMA DATA ANALYTIC</div>
    <h1 class="login-tit">Ingresar al panel DISSAN</h1>

    <label class="fl">Usuario</label>
    <input id="l-user" class="fi" autocomplete="username" spellcheck="false">

    <label class="fl">Contraseña</label>
    <div class="clave">
      <input id="l-pass" class="fi" type="password" autocomplete="current-password">
      <button type="button" class="ojo" id="l-ojo" onclick="verClave()"
              aria-label="Mostrar la contraseña" aria-pressed="false"></button>
    </div>

    <button id="l-btn" class="btn" onclick="entrar()">Entrar</button>
    <div id="l-err" class="err"></div>
    <div class="pie">Mismo usuario y contraseña que el panel de siempre</div>
  </div>
</div>

<!-- ================== APP ================== -->
<div id="app" hidden data-modulo="Stock">
    <div id="shell">
    <div id="sidebar">
      <div class="marca">
        <img class="marca-logo" src="img/ema.png" alt="EMA Data Analytics">
        <div class="marca-pie">Panel DISSAN</div>
      </div>
      <div class="marca-socio">
        <img src="img/macromanager.png" alt="MACROmanager Consultora">
      </div>
      <nav id="menuLateral"></nav>
      <div id="panelUsuario">
        <div class="avatar" id="avatarInicial">?</div>
        <div class="datos">
          <div class="nombre" id="nombreUsuario">&mdash;</div>
          <div class="rol" id="rolUsuario">&mdash;</div>
        </div>
        <button id="btnSalir" onclick="salir()" title="Cerrar sesion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>

    <div id="areaContenido">
      <div id="topbar">
        <div id="tituloModulo">Stock</div>
        <div id="fechaHoy"></div>
      </div>
      <div id="contenido">
      <div class="sub">Qué hay, cuánto vale y qué está quieto. Todo lo suma la base: acá no se
        baja una sola fila cruda.</div>


    <section class="filtros tb-filtros">
      <button class="btn tb-accion" id="b-calc" onclick="calcular()"
              style="margin-top:0">Actualizar</button>
      <div class="hi-sep"></div>
      <div class="fg">
        <label class="fl" for="k-art">Movimientos de un artículo</label>
        <input id="k-art" class="fi" autocomplete="off" spellcheck="false"
               placeholder="COLO0170" style="text-transform:uppercase">
      </div>
      <div class="fg">
        <label class="fl" for="k-desde">Desde</label>
        <input id="k-desde" class="fi" type="date" value="2026-08-01">
      </div>
      <div class="fg">
        <label class="fl" for="k-hasta">Hasta</label>
        <input id="k-hasta" class="fi" type="date" value="2026-08-31">
      </div>
      <button class="btn tb-accion" id="b-kardex" onclick="verKardex()">Ver movimientos</button>
    </section>

    <div id="reloj" class="reloj" hidden></div>
    <div id="aviso" class="aviso" hidden></div>

    <div id="kardex"></div>
    <div id="cuerpo"></div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js?v=9"></script>
<script src="js/bajar-formatos.js?v=1"></script>
<script src="js/bajar.js?v=1"></script>
<script src="js/stock.js?v=2"></script>
</body>
</html>
