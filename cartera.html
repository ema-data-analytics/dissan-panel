<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DISSAN · Cartera de riesgo</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=10">
</head>
<body>

<!-- ================== LOGIN ================== -->
<div id="login-wrap">
  <div class="login-box">
    <div class="marca">EMA DATA ANALYTIC</div>
    <h1 class="login-tit">Ingresar al panel DISSAN</h1>

    <label class="fl">Usuario</label>
    <input id="l-user" class="fi" autocomplete="username" spellcheck="false">

    <label class="fl">Contraseña</label>
    <div class="clave">
      <input id="l-pass" class="fi" type="password" autocomplete="current-password">
      <button type="button" class="ojo" id="l-ojo" onclick="verClave()"
              aria-label="Mostrar la contraseña" aria-pressed="false"></button>
    </div>

    <button id="l-btn" class="btn" onclick="entrar()">Entrar</button>
    <div id="l-err" class="err"></div>
    <div class="pie">Mismo usuario y contraseña que el panel de siempre</div>
  </div>
</div>

<!-- ================== APP ================== -->
<div id="app" hidden>
  <header class="top">
    <div>
      <h1>Cartera de riesgo</h1>
      <div class="sub">Lo que nos deben, por antigüedad, con dos fuentes que no se miran
        entre sí: los vencimientos y la ficha del cliente.</div>
    </div>
    <div class="top-der">
      <a class="btn-s" href="index.html">Margen</a>
      <a class="btn-s" href="tablero.html">Tablero general</a>
      <a class="btn-s" href="ayuda.html">Ayuda</a>
      <a class="btn-s" href="informe.html">Informe</a>
      <a class="btn-s" href="hilo.html">Hilo</a>
      <a class="btn-s" href="stock.html">Stock</a>
      <a class="btn-s" href="compras.html">Compras</a>
      <a class="btn-s" href="tesoreria.html">Tesorería</a>
      <span class="quien" id="quien"></span>
      <button class="btn-s" onclick="salir()">Salir</button>
    </div>
  </header>

  <section class="filtros tb-filtros">
    <div class="fg">
      <label class="fl" for="f-corte">Fecha de corte</label>
      <input id="f-corte" class="fi" type="date">
    </div>
    <div class="fg">
      <label class="fl" for="f-dias">Ventas de los últimos</label>
      <select id="f-dias" class="fi">
        <option value="30">30 días</option>
        <option value="90" selected>90 días</option>
        <option value="180">180 días</option>
        <option value="365">365 días</option>
      </select>
    </div>
    <button class="btn tb-accion" id="b-calc" onclick="calcular()">Ver</button>
  </section>

  <div id="reloj" class="reloj" hidden></div>
  <div id="aviso" class="aviso" hidden></div>

  <div id="cuerpo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js?v=4"></script>
<script src="js/cartera.js?v=3"></script>
</body>
</html>
