<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DISSAN · Cartera de riesgo</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=16">
</head>
<body>

<!-- ================== LOGIN ================== -->
<div id="login-wrap">
  <div class="login-box">
    <div class="marca">EMA DATA ANALYTIC</div>
    <h1 class="login-tit">Ingresar al panel DISSAN</h1>

    <label class="fl">Usuario</label>
    <input id="l-user" class="fi" autocomplete="username" spellcheck="false">

    <label class="fl">Contraseña</label>
    <div class="clave">
      <input id="l-pass" class="fi" type="password" autocomplete="current-password">
      <button type="button" class="ojo" id="l-ojo" onclick="verClave()"
              aria-label="Mostrar la contraseña" aria-pressed="false"></button>
    </div>

    <button id="l-btn" class="btn" onclick="entrar()">Entrar</button>
    <div id="l-err" class="err"></div>
    <div class="pie">Mismo usuario y contraseña que el panel de siempre</div>
  </div>
</div>

<!-- ================== APP ================== -->
<div id="app" hidden data-modulo="Cartera">
    <div id="shell">
    <div id="sidebar">
      <div class="marca">
        <img class="marca-logo" src="img/ema.png" alt="EMA Data Analytics">
        <div class="marca-pie">Panel DISSAN</div>
      </div>
      <div class="marca-socio">
        <img src="img/macromanager.png" alt="MACROmanager Consultora">
      </div>
      <nav id="menuLateral"></nav>
      <div id="panelUsuario">
        <div class="avatar" id="avatarInicial">?</div>
        <div class="datos">
          <div class="nombre" id="nombreUsuario">&mdash;</div>
          <div class="rol" id="rolUsuario">&mdash;</div>
        </div>
        <button id="btnSalir" onclick="salir()" title="Cerrar sesion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>

    <div id="areaContenido">
      <div id="topbar">
        <div id="tituloModulo">Cartera de riesgo</div>
        <div id="fechaHoy"></div>
      </div>
      <div id="contenido">
      <div class="sub">Lo que nos deben, por antigüedad, con dos fuentes que no se miran
        entre sí: los vencimientos y la ficha del cliente.</div>


    <section class="filtros tb-filtros">
      <div class="fg">
        <label class="fl" for="f-corte">Fecha de corte</label>
        <input id="f-corte" class="fi" type="date">
      </div>
      <div class="fg">
        <label class="fl" for="f-dias">Ventas de los últimos</label>
        <select id="f-dias" class="fi">
          <option value="30">30 días</option>
          <option value="90" selected>90 días</option>
          <option value="180">180 días</option>
          <option value="365">365 días</option>
        </select>
      </div>
      <button class="btn tb-accion" id="b-calc" onclick="calcular()">Ver</button>
    </section>

    <div id="reloj" class="reloj" hidden></div>
    <div id="aviso" class="aviso" hidden></div>

    <div id="cuerpo"></div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js?v=7"></script>
<script src="js/cartera.js?v=3"></script>
</body>
</html>
