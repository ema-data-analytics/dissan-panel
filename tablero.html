<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DISSAN · Tablero general</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=12">
</head>
<body>

<!-- ================== LOGIN ================== -->
<div id="login-wrap">
  <div class="login-box">
    <div class="marca">EMA DATA ANALYTIC</div>
    <h1 class="login-tit">Ingresar al panel DISSAN</h1>

    <label class="fl">Usuario</label>
    <input id="l-user" class="fi" autocomplete="username" spellcheck="false">

    <label class="fl">Contraseña</label>
    <div class="clave">
      <input id="l-pass" class="fi" type="password" autocomplete="current-password">
      <button type="button" class="ojo" id="l-ojo" onclick="verClave()"
              aria-label="Mostrar la contraseña" aria-pressed="false"></button>
    </div>

    <button id="l-btn" class="btn" onclick="entrar()">Entrar</button>
    <div id="l-err" class="err"></div>
    <div class="pie">Mismo usuario y contraseña que el panel de siempre</div>
  </div>
</div>

<!-- ================== APP ================== -->
<div id="app" hidden data-modulo="Dashboard">
    <div id="shell">
    <div id="sidebar">
      <div class="marca">
        <img class="marca-logo" src="img/ema.png" alt="EMA Data Analytics">
        <div class="marca-pie">Panel DISSAN</div>
      </div>
      <div class="marca-socio">
        <img src="img/macromanager.png" alt="MACROmanager Consultora">
      </div>
      <nav id="menuLateral"></nav>
      <div id="panelUsuario">
        <div class="avatar" id="avatarInicial">?</div>
        <div class="datos">
          <div class="nombre" id="nombreUsuario">&mdash;</div>
          <div class="rol" id="rolUsuario">&mdash;</div>
        </div>
        <button id="btnSalir" onclick="salir()" title="Cerrar sesion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>

    <div id="areaContenido">
      <div id="topbar">
        <div id="tituloModulo">Tablero general</div>
        <div id="fechaHoy"></div>
      </div>
      <div id="contenido">
      <div class="sub" id="metodo">—</div>


    <section class="filtros tb-filtros">
      <div class="fg">
        <label class="fl" for="f-anio">Año</label>
        <select id="f-anio" class="fi">
          <option value="">todo el período</option>
          <option value="2022">2022</option>
          <option value="2023">2023</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026" selected>2026</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl" for="f-mes">Mes</label>
        <select id="f-mes" class="fi">
          <option value="">todo el año</option>
          <option value="1">enero</option>
          <option value="2">febrero</option>
          <option value="3">marzo</option>
          <option value="4">abril</option>
          <option value="5">mayo</option>
          <option value="6">junio</option>
          <option value="7">julio</option>
          <option value="8">agosto</option>
          <option value="9">septiembre</option>
          <option value="10">octubre</option>
          <option value="11">noviembre</option>
          <option value="12">diciembre</option>
        </select>
      </div>
      <div class="fg tb-busca">
        <label class="fl" for="f-clientes">Cliente</label>
        <input id="f-clientes" class="fi" autocomplete="off" placeholder="escribí un cliente…">
        <div class="tb-lista" id="l-clientes" hidden></div>
        <div class="tb-chips" id="c-clientes"></div>
      </div>
      <div class="fg tb-busca">
        <label class="fl" for="f-zonas">Zona</label>
        <input id="f-zonas" class="fi" autocomplete="off" placeholder="MENDOZA, SAN JUAN…">
        <div class="tb-lista" id="l-zonas" hidden></div>
        <div class="tb-chips" id="c-zonas"></div>
      </div>
      <button class="btn tb-accion" id="b-calc" onclick="calcular()">Ver</button>
      <button class="btn-s tb-accion" id="b-limpiar" onclick="limpiar()">Todo</button>
    </section>

    <div id="reloj" class="reloj" hidden></div>
    <div id="aviso" class="aviso" hidden></div>

    <div id="cuerpo"></div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js?v=6"></script>
<script src="js/tablero.js?v=3"></script>
</body>
</html>
